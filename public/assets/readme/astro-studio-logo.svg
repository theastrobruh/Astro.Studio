<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 130" width="460" height="130">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Cosmic Window -->
  <rect x="4" y="4" width="452" height="122" rx="18" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="2"/>

  <!-- Subtle Starfield -->
  <circle cx="40" cy="24" r="1.2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="415" cy="28" r="1.5" fill="#00E5FF" opacity="0.8"/>
  <circle cx="385" cy="98" r="1" fill="#F59E0B" opacity="0.7"/>
  <circle cx="95" cy="102" r="1.2" fill="#8B5CF6" opacity="0.6"/>

  <!-- Aperture / Lens Emblem -->
  <g transform="translate(68, 65)" filter="url(#glow)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="url(#accentGrad)" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="14 8">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="6" fill="#00E5FF" opacity="0.9"/>
    <circle cx="22" cy="-22" r="3" fill="#F59E0B"/>
  </g>

  <!-- Title -->
  <text x="122" y="64" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" fill="#F8FAFC">
    Astro<tspan fill="url(#accentGrad)">.Studio</tspan>
  </text>

  <!-- Subtitle -->
  <text x="124" y="90" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" letter-spacing="1.1" fill="#94A3B8">
    BROWSER-NATIVE PHOTO &amp; COLOR GRADING STUDIO
  </text>
</svg>
